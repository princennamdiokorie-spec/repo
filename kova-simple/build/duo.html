<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Montserrat:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
/* Kova two-host flyer (blue), in the format of the client's RUNTOWN / MS DSF / KID CARDER flyer. 1080x1350.
   Text block positions are the spotlight flyer's (flyer-swap.html). */
:root{--navy:#040a1c;--silver:#c9ced8;--blue:#2a8cff;--blue-hi:#7cc4ff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--navy);overflow:hidden}
.f{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:radial-gradient(ellipse 70% 42% at 50% 34%,#0b2257 0%,#06112e 45%,#040a1c 80%)}
.grain{position:absolute;inset:0;opacity:.06;background:repeating-radial-gradient(circle at 30% 20%,#fff 0 1px,transparent 1px 3px)}
svg.fx{position:absolute;left:0;top:0;width:1080px;height:1350px}
.logo{position:absolute;left:50%;top:40px;width:150px;transform:translateX(-50%);filter:drop-shadow(0 0 10px rgba(42,140,255,.55))}
.presents{position:absolute;left:0;right:0;top:154px;text-align:center;font:500 13px/1 Montserrat,sans-serif;letter-spacing:8px;padding-left:8px;color:var(--silver)}

/* host photos: each fades out at the bottom (--f0 → --f1) and at the sides (--sl / --sr) */
.ph{position:absolute;--f0:60%;--f1:85%;--sl:0%;--sr:100%;
  -webkit-mask-image:linear-gradient(180deg,#000 var(--f0),transparent var(--f1)),linear-gradient(90deg,transparent 0,#000 var(--sl),#000 var(--sr),transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  mask-image:linear-gradient(180deg,#000 var(--f0),transparent var(--f1)),linear-gradient(90deg,transparent 0,#000 var(--sl),#000 var(--sr),transparent 100%)}
#p1{left:20px;top:70px;width:510px;--f0:69%;--f1:88%;--sl:4%;--sr:80%;z-index:2;filter:grayscale(1) contrast(1.08) brightness(1.02)}
#p2{left:221px;top:25px;width:1120px;--f0:29%;--f1:36.5%;--sl:22%;--sr:90%;z-index:1;filter:contrast(1.05) brightness(1.06) saturate(1.05)}

.chrome{background:linear-gradient(180deg,#ffffff 0%,#e6ebf3 38%,#9aa6b8 55%,#f4f7fb 72%,#c3cbd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #1a2b55) drop-shadow(0 0 8px rgba(160,205,255,.75)) drop-shadow(0 0 26px rgba(42,140,255,.65))}
.host{position:absolute;z-index:3;text-align:center;width:520px;transform:translateX(-50%)}
.host .lb{font:600 13px/1 Montserrat,sans-serif;letter-spacing:8px;padding-left:8px;color:var(--blue-hi);margin-bottom:12px;text-shadow:0 0 8px rgba(4,10,28,.9)}
.host .nm{font:900 58px/1 Cinzel,serif;letter-spacing:3px;padding-left:3px}
#h1{left:262px;top:688px}
#h2{left:800px;top:688px}

.title{position:absolute;z-index:3;left:0;right:0;top:826px;text-align:center;font:600 92px/1 Cinzel,serif;letter-spacing:6px;padding-left:6px}
.kicker{position:absolute;left:0;right:0;top:934px;text-align:center;font:700 21px/1 Montserrat,sans-serif;letter-spacing:12px;padding-left:12px;color:#e8ecf3}
.rule{position:absolute;left:50%;top:984px;width:420px;transform:translateX(-50%);display:flex;align-items:center;gap:16px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--blue-hi))}
.rule i.r{background:linear-gradient(270deg,transparent,var(--blue-hi))}
.rule img{width:30px;filter:drop-shadow(0 0 6px rgba(42,140,255,.9))}
.d{position:absolute;left:0;right:0;text-align:center;font:500 19px/1 Montserrat,sans-serif;letter-spacing:5px;padding-left:5px;color:#eef2f8}
.d b{font-weight:600;color:var(--blue-hi)}
.d1{top:1024px}.d2{top:1062px}
.res{position:absolute;left:0;right:0;top:1130px;text-align:center;font:500 12px/1 Montserrat,sans-serif;letter-spacing:7px;padding-left:7px;color:#8f9ab0}
.c1{position:absolute;left:0;right:0;top:1158px;text-align:center;font:500 22px/1 Montserrat,sans-serif;letter-spacing:2px;color:#fff}
.c1 b{color:var(--blue-hi);font-weight:600}
.c2{position:absolute;left:0;right:0;top:1196px;text-align:center;font:400 18px/1 Montserrat,sans-serif;letter-spacing:1.5px;color:#d8dee9}
.c2 .it{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.c2 .ic{width:19px;height:19px;flex:none;filter:drop-shadow(0 0 4px rgba(42,140,255,.6))}
.c2 .bar{display:inline-block;width:1px;height:16px;vertical-align:middle;margin:0 18px;background:var(--blue-hi)}
</style></head><body>
<div class="f">
  <svg class="fx" viewBox="0 0 1080 1350">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3c96ff" stop-opacity=".5"/><stop offset=".5" stop-color="#1f6be0" stop-opacity=".18"/><stop offset="1" stop-color="#1f6be0" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="540" cy="430" rx="420" ry="260" fill="url(#halo)"/>
    <g id="dust"></g>
  </svg>
  <div class="grain"></div>
  <img class="logo" src="../assets/kova-logo-transparent.png" alt="">
  <div class="presents">KOVA LIFESTYLE PRESENTS</div>
  <img class="ph" id="p2" src="../artists/highprince-src.png" alt="">
  <img class="ph" id="p1" src="../artists/yhemolee-src.png" alt="">
  <div class="host" id="h1"><div class="lb">HOSTED BY</div><div class="nm chrome">YHEMOLEE</div></div>
  <div class="host" id="h2"><div class="lb">HOSTED BY</div><div class="nm chrome">HIGHPRINCE</div></div>

  <div class="title chrome">GRAND OPENING</div>
  <div class="kicker">KOVA LIFESTYLE</div>
  <div class="rule"><i></i><img src="../assets/kova-symbol-hd.png" alt=""><i class="r"></i></div>
  <div class="d d1">THURSDAY 10TH DECEMBER 2026</div>
  <div class="d d2"><b>DOORS 10 PM</b> · 30 OLEH ROAD, SAPELE, DELTA STATE</div>
  <div class="res">RESERVATIONS</div>
  <div class="c1">Call / WhatsApp <b>09166586974</b></div>
  <div class="c2"><span class="it"><svg class="ic" viewBox="0 0 24 24"><path fill="#7cc4ff" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>info@kova-lifestyle.com</span><span class="bar"></span><span class="it"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.2" fill="none" stroke="#7cc4ff" stroke-width="2.2"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="#7cc4ff" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#7cc4ff"/></svg><svg class="ic" viewBox="0 0 24 24"><path fill="#7cc4ff" d="M12 2.2c3 0 5.3 2.3 5.3 5.4v2.6c.5.2 1.2-.3 1.700-.1.6.3.4 1-.1 1.3-.6.3-1.6.5-1.7 1 .6 1.9 2.2 3.5 4.1 4 .4.1.5.6.1.8-.7.4-1.7.4-2 .8-.2.5-.2 1-.7 1.1-.7.1-1.5-.3-2.4.1-1 .5-1.7 1.6-4.3 1.6s-3.3-1.1-4.3-1.6c-.9-.4-1.700 0-2.4-.1-.5-.1-.5-.6-.7-1.1-.3-.4-1.3-.4-2-.8-.4-.2-.3-.7.1-.8 1.9-.5 3.5-2.1 4.1-4-.1-.5-1.1-.7-1.7-1-.5-.3-.7-1-.1-1.3.5-.2 1.2.3 1.7.1V7.6c0-3.1 2.3-5.4 5.3-5.4z"/></svg>@kova.lifestyle</span></div>
</div>
<script>
let s = 9, r = () => (s = (s * 16807) % 2147483647) / 2147483647, h = '';
for (let i = 0; i < 40; i++) h += `<circle cx="${r() * 1080}" cy="${150 + r() * 420}" r="${.6 + r() * 1.6}" fill="#dbeaff" opacity="${.25 + r() * .55}"/>`;
document.getElementById('dust').innerHTML = h;
</script>
</body></html>
