<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
/* Chrome lettering matched to plaque B's nameplate: mirror fill, navy outline, blue extruded edge */
#t{display:inline-block;padding:20px 24px 30px;white-space:nowrap;
  font:800 124px/1 Montserrat,sans-serif;letter-spacing:7px;
  background:linear-gradient(180deg,#ffffff 0%,#e3e8f0 34%,#8a95a6 46%,#4f5a6b 52%,#c9d0db 60%,#ffffff 74%,#a3adbd 90%,#6d788a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  /* outline via shadows, not text-stroke: stroke traces the font's overlapping contours */
  filter:drop-shadow(1.5px 0 0 #0d1d4a) drop-shadow(-1.5px 0 0 #0d1d4a) drop-shadow(0 -1.5px 0 #0d1d4a) drop-shadow(0 1.5px 0 #0d1d4a)
         drop-shadow(1px 2px 0 #3d8bff) drop-shadow(1px 3px 0 #1846c9) drop-shadow(1px 3px 0 #0a1f66) drop-shadow(0 0 5px rgba(47,123,255,.85)) drop-shadow(0 6px 6px rgba(0,0,0,.55))}
</style></head><body><span id="t">OF KOVA NIGHTCLUB</span></body></html>
