<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Michroma&family=Cinzel:wght@600;800&family=Barlow+Condensed:wght@600;800&display=block" rel="stylesheet">
<style>
:root{--blue:#1f6bff;--cyan:#4fc3ff;--ink:#01030a;--navy:#06143d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden}
.f{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#0b2366 0%,#020818 70%)}

/* velvet curtains: vertical folds */
.curtain{position:absolute;top:-20px;height:1400px;width:330px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.6)),
    repeating-linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(160,200,255,.10) 70px,rgba(255,255,255,0) 140px),repeating-linear-gradient(90deg,#020a2a 0,#0a2a8c 16px,#1d4fd6 27px,#0c2f9e 38px,#020a2a 56px);
  filter:saturate(1.1)}
.curtain.l{left:-40px;clip-path:path('M0 0 H330 C250 250 160 520 140 760 C130 980 210 1180 330 1400 H0 Z')}
.curtain.r{right:-40px;transform:scaleX(-1);clip-path:path('M0 0 H330 C250 250 160 520 140 760 C130 980 210 1180 330 1400 H0 Z')}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,170,255,.18),transparent 25%,transparent 70%,rgba(0,0,0,.7))}
.valance{position:absolute;left:0;right:0;top:0;height:70px;
  background:repeating-radial-gradient(ellipse 60px 70px at 60px -10px,#1d4fd6 0,#0a2479 45%,#020a2a 70%,transparent 71%);
  background-size:120px 80px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.8))}

/* neon ring behind the arch */
.ring{position:absolute;left:50%;top:120px;width:920px;height:920px;transform:translateX(-50%);border-radius:50%;
  border:6px solid #bfe6ff;box-shadow:0 0 18px 4px #2f7bff,0 0 60px 12px rgba(31,107,255,.7),inset 0 0 18px 4px #2f7bff,inset 0 0 60px 12px rgba(31,107,255,.5)}

/* chrome arch */
.arch{position:absolute;left:50%;top:56px;width:720px;height:1060px;transform:translateX(-50%);
  border-radius:360px 360px 26px 26px;padding:16px;
  background:linear-gradient(135deg,#ffffff 0%,#8e9ab0 18%,#e9eef6 34%,#59647a 50%,#f4f7fb 66%,#8a96aa 82%,#dfe5ee 100%);
  box-shadow:0 0 0 3px #0a1a4a,0 30px 60px rgba(0,0,0,.8),0 0 50px rgba(31,107,255,.55)}
.inner{position:relative;width:100%;height:100%;border-radius:344px 344px 14px 14px;overflow:hidden;
  background:radial-gradient(ellipse 90% 45% at 50% 22%,#0f2e7a 0%,#050c22 55%,#020510 100%);
  box-shadow:inset 0 0 0 2px var(--cyan),inset 0 0 40px rgba(31,107,255,.6)}
.inner::before{content:"";position:absolute;inset:0;opacity:.07;
  background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:80px;text-align:center}

.logo{width:300px;filter:drop-shadow(0 0 14px rgba(31,107,255,.7))}
.title{width:640px;margin-top:6px;filter:drop-shadow(0 16px 24px rgba(0,0,0,.85)) drop-shadow(0 0 22px rgba(31,107,255,.4))}

.chrome{background:linear-gradient(180deg,#ffffff 0%,#dfe6ef 40%,#8994a6 52%,#f4f7fb 68%,#b6c0cf 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:470px;height:2px;margin:26px 0 0;background:linear-gradient(90deg,transparent,#bfe6ff,transparent);box-shadow:0 0 10px #2f7bff}

.dateline{display:flex;align-items:center;gap:20px;margin-top:22px}
.dateline .m{font:800 50px/1 Cinzel,serif;letter-spacing:6px;color:#e9eff8}
.dateline .d{font:118px/1 Anton,sans-serif;letter-spacing:2px;filter:drop-shadow(0 4px 0 #0a1d55) drop-shadow(0 0 16px rgba(79,195,255,.55))}
.dateline .dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.days{font:600 26px/1 Michroma,sans-serif;letter-spacing:5px;color:var(--cyan);margin-top:12px;text-shadow:0 0 12px rgba(31,107,255,.9)}
.time{margin-top:30px;font:800 46px/1 'Barlow Condensed',sans-serif;letter-spacing:6px;color:#fff}
.time span{color:var(--cyan)}

.contacts{position:absolute;left:0;right:0;bottom:40px;text-align:center}
.contacts .phone{font:64px/1 Anton,sans-serif;letter-spacing:3px;color:#fff;text-shadow:0 0 18px rgba(31,107,255,.9),0 4px 0 #0a1d55}
.contacts .phone small{font:600 20px/1 Michroma,sans-serif;letter-spacing:5px;color:var(--cyan);vertical-align:middle;margin-right:14px}
.row{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:14px;
  font:800 30px/1 'Barlow Condensed',sans-serif;letter-spacing:1px;color:#e9eff8}
.row .it{display:flex;align-items:center;gap:10px}
.row .bar{width:2px;height:30px;background:rgba(191,230,255,.6)}
.row svg{flex:none}
.shade{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(0deg,rgba(1,3,10,.95),transparent)}
.topshade{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(180deg,rgba(1,3,10,.9),transparent)}
.spark{position:absolute;border-radius:50%;background:#dff0ff;box-shadow:0 0 8px 2px #4f9bff}
</style></head><body>
<div class="f">
  <div class="ring"></div>
  <div class="arch"><div class="inner">
    <div class="content">
      <img class="logo" src="../logo/kova-logo-transparent.png" alt="">
      <img class="title" src="../title/grand-opening-title-B.png" alt="">
      <div class="rule"></div>
      <div class="dateline">
        <div class="m">DEC</div>
        <div class="d chrome">10</div><div class="dot"></div>
        <div class="d chrome">11</div><div class="dot"></div>
        <div class="d chrome">12</div>
      </div>
      <div class="days">THU · FRI · SAT</div>
      <div class="rule"></div>
      <div class="time"><span>DOORS OPEN</span> 10PM</div>
    </div>
  </div></div>
  <div class="curtain l"></div><div class="curtain r"></div>
  <div class="topshade"></div>
  <div id="sparks"></div>
  <div class="shade"></div>
  <div class="contacts">
    <div class="phone"><small>RESERVATIONS</small>09166586974</div>
    <div class="row">
      <div class="it">
        <svg width="30" height="30" viewBox="0 0 24 24"><path fill="#4fc3ff" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
        info@kova-lifestyle.com</div>
      <div class="bar"></div>
      <div class="it">
        <svg width="28" height="28" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="#4fc3ff" stroke-width="2.4"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="#4fc3ff" stroke-width="2.4"/><circle cx="17.4" cy="6.6" r="1.4" fill="#4fc3ff"/></svg>
        <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#4fc3ff" d="M12 2.2c3 0 5.3 2.3 5.3 5.4v2.6c.5.2 1.2-.3 1.7-.1.6.3.4 1-.1 1.3-.6.3-1.6.5-1.7 1 .6 1.9 2.2 3.5 4.1 4 .4.1.5.6.1.8-.7.4-1.7.4-2 .8-.2.5-.2 1-.7 1.1-.7.1-1.500-.3-2.4.1-1 .5-1.7 1.6-4.3 1.6s-3.3-1.1-4.3-1.6c-.9-.4-1.7 0-2.4-.1-.5-.1-.5-.6-.7-1.1-.3-.4-1.3-.4-2-.8-.4-.2-.3-.7.1-.8 1.9-.5 3.5-2.1 4.1-4-.1-.5-1.1-.7-1.7-1-.5-.3-.7-1-.1-1.3.5-.2 1.2.3 1.7.1V7.6c0-3.1 2.3-5.4 5.3-5.4z"/></svg>
        @kova.lifestyle</div>
    </div>
  </div>
</div>
<script>
let s=11,r=()=>(s=(s*16807)%2147483647)/2147483647,h='';
for(let i=0;i<55;i++){const z=1+r()*3;h+=`<div class="spark" style="left:${r()*1080}px;top:${r()*1100}px;width:${z}px;height:${z}px;opacity:${.3+r()*.7}"></div>`}
document.getElementById('sparks').innerHTML=h;
</script>
</body></html>
